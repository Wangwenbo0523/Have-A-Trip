name: license-gate

# 许可证卡口: 防止 GPL/AGPL 或非商用许可混入, 保住「将来可闭源」的退路。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 装上真实依赖, 卡口才能扫到它们; 只装运行必需的部分
      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      # 前端刻意不装 node_modules: license_gate.py 直接解析 frontend/package-lock.json,
      # 不读 node_modules。原先那步 `npm ci` 既拖慢卡口, 又会把上游 lockfile 的
      # 依赖解析错误(如 ERESOLVE)变成卡口失败, 已移除。

      - name: 跑许可证卡口
        run: python scripts/license_gate.py --strict

      # 工作流文件本身写坏了的话, GitHub 只会记一次没有 job 的 failure,
      # 之后每次推送都「看起来跑了, 其实一步没跑」。这里先解析一遍挡住这种静默失效。
      - name: 校验 CI 配置可解析
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              jobs = list((doc or {}).get("jobs") or {})
              if not jobs:
                  raise SystemExit(f"{path}: 没有解析出任何 job")
              print(f"{path.name}: name={doc.get('name')!r} jobs={jobs}")
          PY

      - name: 校验基底 LICENSE 与钉版记录
        run: |
          if [ ! -f frontend/LICENSE ]; then
            echo "::error::frontend/LICENSE 丢失, MIT 要求保留版权声明"
            exit 1
          fi
          python - <<'PY'
          import json, pathlib
          lock = json.loads(pathlib.Path("scripts/bases.lock.json").read_text(encoding="utf-8-sig"))
          for name, info in lock["bases"].items():
              print(f"{name}: {info['upstream']} @ {info.get('commit') or info.get('version')} [{info['license']}]")
          PY
      # 站点图标是脚本生成的, 不是手绘文件。改了脚本忘了重跑、或者有人直接手改那个 .ico,
      # 这里都会红。图标同样是版权资产, 让它保持可复现。
      - name: 校验站点图标与生成脚本一致
        run: python scripts/make_favicon.py --check

      # 景点封面也是脚本生成的。改了 seed.sql 的景点清单却忘了重跑生成脚本,
      # 靠这一条拦; 手改 public/ 下的 SVG 同样会红。
      - name: 校验景点配图与生成脚本一致
        run: python scripts/make_attraction_covers.py --check
