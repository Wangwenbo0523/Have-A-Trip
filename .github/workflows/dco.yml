name: dco

# DCO 校验: CONTRIBUTING.md 要求每个 commit 都带 Signed-off-by, 这里把要求变成事实。
# 起因是「现在开源、将来可能闭源」—— 没有版权集中, 闭源要回头找每个贡献者签字。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  signoff:
    runs-on: ubuntu-latest
    # 维护者通过 GitHub 网页编辑产生的 commit 加不上 Signed-off-by(网页编辑器
    # 不提供 `-s`)。DCO 真正要挡的是**外部贡献**, 那条路径是 PR —— 所以 PR 上
    # 硬失败, push 到 main 只告警, 免得主干长期挂一个红叉。检查本身照跑。
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要拿到区间内的全部 commit, 浅克隆不够
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 校验 commit 签名
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python scripts/check_dco.py "${BASE}..${HEAD}"