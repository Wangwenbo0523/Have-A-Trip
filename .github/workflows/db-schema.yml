name: db-schema

# 用真实 PostgreSQL 验证 db/schema.sql 与 db/seed/seed.sql:
# 各跑两遍证明幂等, 再断言结构、行数与 CHECK 约束。
# 本机没有 psql, 所以这是「行为层」唯一的验证手段。
on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - ".github/workflows/db-schema.yml"
  pull_request:
    paths:
      - "db/**"
      - ".github/workflows/db-schema.yml"
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attraction_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: 应用 schema.sql 两次(验证幂等)
        run: |
          for i in 1 2; do
            echo "--- schema.sql 第 $i 次 ---"
            psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/schema.sql
          done

      - name: 应用 seed.sql / attractions_cn.sql / images.sql 各两次(验证幂等)
        run: |
          for i in 1 2; do
            echo "--- 第 $i 次 ---"
            psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/seed/seed.sql
            psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/seed/attractions_cn.sql
            psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/seed/images.sql
          done

      - name: 断言结构与数据
        run: |
          set -euo pipefail
          q() { psql -h 127.0.0.1 -U postgres -d attraction_atlas -tAc "$1"; }
          expect() { # expect <期望> <实际> <说明>
            if [ "$1" != "$2" ]; then echo "::error::$3: 期望 $1, 实际 $2"; exit 1; fi
            echo "OK: $3 = $2"
          }

          expect 16 "$(q "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")" "表数量"
          expect 1 "$(q "select count(*) from information_schema.views where table_schema='public';")" "视图数量"
          expect 1 "$(q "select count(*) from information_schema.triggers where trigger_name='trg_attraction_updated_at';")" "updated_at 触发器"

          # 种子数据规模。改了 db/seed/ 里的种子文件就要一起改这里的数字, 否则 CI 会拦下来
          expect 10 "$(q "select count(*) from category;")" "category 行数"
          expect 32 "$(q "select count(*) from tag;")" "tag 行数"
          expect 1385 "$(q "select count(*) from attraction;")" "attraction 行数(重跑未重复插入)"
          # 官方名录条目(attractions_cn.sql)与自采档案(seed.sql)是两批东西, 各自钉一个数字
          expect 1229 "$(q "select count(*) from attraction where license = '政府公开信息（官方名录）';")" "来自官方名录的景点数"
          expect 156 "$(q "select count(*) from attraction where source = 'Have-A-Trip 自采（公开事实信息）';")" "自采景点数"
          expect 552 "$(q "select count(*) from attraction_tag;")" "attraction_tag 行数"
          expect 1 "$(q "select count(*) from schema_version where version='0001_init';")" "schema_version 0001 记录数"
          expect 1 "$(q "select count(*) from schema_version where version='0002_plans';")" "schema_version 0002 记录数"
          expect 1 "$(q "select count(*) from schema_version where version='0003_ai';")" "schema_version 0003 记录数"
          expect 1 "$(q "select count(*) from schema_version where version='0004_posts';")" "schema_version 0004 记录数"
          expect 1 "$(q "select count(*) from schema_version where version='0005_image_source';")" "schema_version 0005 记录数"
          # 新增的两张表都带 updated_at, 触发器必须真的挂上 —— 配额计数器是靠 UPDATE 自增的
          expect 2 "$(q "select count(*) from information_schema.triggers where trigger_name in ('trg_attraction_embedding_updated_at','trg_trip_quota_updated_at');")" "向量与配额表的 updated_at 触发器"

          # 种子数据的口径, 见 db/README.md「种子数据的口径」
          # 这几条是把「不编造、不夸大」变成机器能拦的检查
          expect 0 "$(q "select count(*) from attraction where source is null or license is null;")" "缺 source/license 的景点数"
          expect 0 "$(q "select count(*) from attraction where status <> 'published';")" "非 published 的种子景点数"
          expect 0 "$(q "select count(*) from attraction where lat is not null or lon is not null;")" "带坐标的种子景点数(一期不做地图与定位)"
          expect 0 "$(q "select count(*) from attraction where rating_avg <> 0 or rating_count <> 0;")" "带评分的种子景点数(评分只能由 behavior_log 聚合)"
          expect 0 "$(q "select count(*) from attraction where ticket_price is not null and ticket_price <> 0;")" "写了票价但不确定免费的景点数"
          expect 1385 "$(q "select count(*) from attraction_image;")" "图片行数"
          expect 1385 "$(q "select count(distinct attraction_id) from attraction_image;")" "有配图的景点数"
          expect 0 "$(q "select count(*) from attraction_image where credit is null or credit = '' or license is null or license = '';")" "缺 credit/license 的图片数"
          # 逐图署名: 实拍照片必须带来源页, 自绘图必须不带 —— 两边都钉死, 免得「谁都带一点」
          expect 199 "$(q "select count(*) from attraction_image where source_url is not null;")" "带来源页的图片数(逐图署名用)"
          expect 0 "$(q "select count(*) from attraction_image where source_url is not null and url like '%.svg';")" "自绘图却带了外部来源的数"
          expect 0 "$(q "select count(*) from attraction_image where source_url is null and url not like '%.svg';")" "实拍照片缺来源页的数"
          # 标签与方案只对自采档案有要求: 官方名录条目是名称条目, 没有主题标签,
          # 也没有逐条写过的行程建议。给它们编一套就是造假, 所以这两条只查自采的那 156 条。
          expect 0 "$(q "select count(*) from attraction a where a.source = 'Have-A-Trip 自采（公开事实信息）' and not exists (select 1 from attraction_tag x where x.attraction_id = a.id);")" "自采景点里没有任何标签的数"
          expect 0 "$(q "select count(*) from category c where not exists (select 1 from attraction a where a.category_id = c.id);")" "没有景点的分类数"
          expect 0 "$(q "select count(*) from tag g where not exists (select 1 from attraction_tag x where x.tag_id = g.id);")" "没被用到的标签数"

          # v2.0: 景区等级 / 世界遗产 / 旅游方案
          expect 1279 "$(q "select count(*) from attraction where a_level is not null;")" "填了 a_level 的景点数(自采 50 + 官方名录 1229)"
          expect 63 "$(q "select count(*) from attraction where heritage is not null;")" "填了 heritage 的景点数"
          expect 0 "$(q "select count(*) from attraction where country_code <> 'CN' and a_level is not null;")" "境外景点带 a_level 的数(A 级只针对中国大陆景区)"
          expect 156 "$(q "select count(*) from attraction_plan;")" "旅游方案数"
          expect 506 "$(q "select count(*) from attraction_plan_step;")" "方案步骤数"
          expect 0 "$(q "select count(*) from attraction a where a.source = 'Have-A-Trip 自采（公开事实信息）' and not exists (select 1 from attraction_plan p where p.attraction_id = a.id);")" "自采景点里没有方案的数"
          expect 0 "$(q "select count(*) from attraction_plan p where not exists (select 1 from attraction_plan_step s where s.plan_id = p.id);")" "没有步骤的方案数"
          expect 0 "$(q "select count(*) from (select plan_id, day_no, sort from attraction_plan_step group by 1,2,3 having count(*) > 1) x;")" "同一方案同一天内重复的步骤序号数"
          expect 0 "$(q "select count(*) from attraction_plan_step where detail is null or btrim(detail) = '';")" "缺 detail 的步骤数"
          expect 0 "$(q "select count(*) from attraction_plan p join attraction a on a.id = p.attraction_id where p.slug <> a.slug || '-plan';")" "plan slug 与 -plan 不匹配的数"
          expect 0 "$(q "select count(*) from attraction_plan_step s join attraction_plan p on p.id = s.plan_id where s.day_no > p.days or s.day_no < 1;")" "步骤天数越界的数"
          expect 0 "$(q "select count(*) from attraction_plan where source is null or license is null or summary is null;")" "缺 source/license/summary 的方案数"

      - name: 断言重跑种子能修回被改动的行
        run: |
          set -euo pipefail
          q() { psql -h 127.0.0.1 -U postgres -d attraction_atlas -tAc "$1"; }
          expect() { if [ "$1" != "$2" ]; then echo "::error::$3: 期望 $1, 实际 $2"; exit 1; fi; echo "OK: $3"; }

          # 模拟两种情况: 有人手工改了库里的一行, 以及库里躺着的还是上一个版本的种子
          # (旧版种子写死过坐标与票价, 也用过 ON CONFLICT DO NOTHING, 那样的库不会被修好)
          q "update attraction set name='旧名字', lat=1.0, lon=2.0, ticket_price=999.00, a_level='3A', heritage=null where slug='west-lake';" > /dev/null
          q "delete from attraction_tag where attraction_id = (select id from attraction where slug='west-lake');" > /dev/null
          q "delete from attraction_plan_step where plan_id = (select id from attraction_plan where slug='west-lake-plan');" > /dev/null
          # 配图的来源页与署名也要能自愈: 被清空 / 被改坏之后, 重跑 images.sql 要修回来
          q "update attraction_image set source_url=null, credit='被改坏了' where url='/images/covers/west-lake.jpg';" > /dev/null

          # 名录条目由另一个文件维护(db/seed/attractions_cn.sql), 它的自愈也要验:
          # 等级被摘牌、状态被改成 draft、来源被改坏, 重跑都要修回来
          q "update attraction set name='旧名字', a_level='4A', status='draft', license='被改坏了', source_url='http://x' where slug='5a-shanghai-001';" > /dev/null

          psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/seed/seed.sql
          psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/seed/attractions_cn.sql
          psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/seed/images.sql

          expect "西湖" "$(q "select name from attraction where slug='west-lake';")" "name 被同步回文件里的版本"
          expect 1 "$(q "select count(*) from attraction where slug='west-lake' and lat is null and lon is null;")" "坐标被清回 NULL"
          expect 1 "$(q "select count(*) from attraction where slug='west-lake' and ticket_price = 0;")" "票价回到文件里的 0"
          expect 4 "$(q "select count(*) from attraction_tag where attraction_id = (select id from attraction where slug='west-lake');")" "被删掉的标签关联被重建"
          expect "5A" "$(q "select a_level from attraction where slug='west-lake';")" "手工改过的 a_level 被同步回文件里的版本"
          expect "cultural" "$(q "select heritage from attraction where slug='west-lake';")" "手工改过的 heritage 被同步回文件里的版本"
          expect 4 "$(q "select count(*) from attraction_plan_step where plan_id = (select id from attraction_plan where slug='west-lake-plan');")" "被删掉的方案步骤被重建"
          expect "西沙明珠湖景区" "$(q "select name from attraction where slug='5a-shanghai-001';")" "名录条目的 name 被同步回文件里的版本"
          expect "5A" "$(q "select a_level from attraction where slug='5a-shanghai-001';")" "名录条目的 a_level 被同步回文件里的版本"
          expect "published" "$(q "select status from attraction where slug='5a-shanghai-001';")" "名录条目的 status 被同步回 published"
          expect "政府公开信息（官方名录）" "$(q "select license from attraction where slug='5a-shanghai-001';")" "名录条目的 license 被同步回文件里的版本"
          expect 1385 "$(q "select count(*) from attraction;")" "重跑后景点数仍是 1385, 没有多出来"
          expect 156 "$(q "select count(*) from attraction_plan;")" "重跑后方案数仍是 156, 没有多出来"
          expect 1 "$(q "select count(*) from attraction_image where url='/images/covers/west-lake.jpg' and source_url like 'https://commons.wikimedia.org/%' and credit='Black Dragon Society';")" "被清空的来源页与被改坏的署名都被重跑修回来"

      - name: 断言 CHECK 约束真的拦得住
        run: |
          set -euo pipefail
          q() { psql -h 127.0.0.1 -U postgres -d attraction_atlas -tAc "$1"; }

          q "insert into app_user (device_id) values ('ci-probe');" > /dev/null
          uid=$(q "select id from app_user where device_id='ci-probe';")
          aid=$(q "select id from attraction where slug='west-lake';")

          # rate 事件不带 rating 必须被拒
          if q "insert into behavior_log (user_id, attraction_id, event_type) values ($uid, $aid, 'rate');" > /dev/null 2>&1; then
            echo "::error::behavior_rate_needs_rating 约束没有生效"
            exit 1
          fi
          echo "OK: rate 缺 rating 被拒绝"

          # 越界评分必须被拒
          if q "insert into behavior_log (user_id, attraction_id, event_type, rating) values ($uid, $aid, 'rate', 9);" > /dev/null 2>&1; then
            echo "::error::rating 范围约束没有生效"
            exit 1
          fi
          echo "OK: rating=9 被拒绝"

          # 非法 event_type 必须被拒
          if q "insert into behavior_log (user_id, attraction_id, event_type) values ($uid, $aid, 'click');" > /dev/null 2>&1; then
            echo "::error::event_type 枚举约束没有生效"
            exit 1
          fi
          echo "OK: event_type=click 被拒绝"

          # 合法的插入必须成功
          q "insert into behavior_log (user_id, attraction_id, event_type, rating) values ($uid, $aid, 'rate', 4.5);" > /dev/null
          expect() { if [ "$1" != "$2" ]; then echo "::error::$3"; exit 1; fi; echo "OK: $3"; }
          expect 1 "$(q "select count(*) from behavior_log where user_id=$uid and event_type='rate';")" "合法 rate 事件写入成功"

          # status 只允许三态
          if q "insert into attraction (slug, name, category_id, status, source, license) values ('x','x',(select id from category limit 1),'live','t','t');" > /dev/null 2>&1; then
            echo "::error::status 枚举约束没有生效"
            exit 1
          fi
          echo "OK: status=live 被拒绝"

          # a_level / heritage 只允许枚举内的值
          if q "update attraction set a_level='6A' where slug='west-lake';" > /dev/null 2>&1; then
            echo "::error::a_level 枚举约束没有生效"
            exit 1
          fi
          echo "OK: a_level=6A 被拒绝"

          if q "update attraction set heritage='sacred' where slug='west-lake';" > /dev/null 2>&1; then
            echo "::error::heritage 枚举约束没有生效"
            exit 1
          fi
          echo "OK: heritage=sacred 被拒绝"

          # budget_level 只允许四档
          if q "update attraction_plan set budget_level='luxury' where slug='west-lake-plan';" > /dev/null 2>&1; then
            echo "::error::budget_level 枚举约束没有生效"
            exit 1
          fi
          echo "OK: budget_level=luxury 被拒绝"

          # itinerary.status 只允许五态。rejected(被限额拦下, 没花钱)与 failed(调了模型但失败)必须分开
          if q "insert into itinerary (public_token, owner_key, days, request_hash, cache_key, status) values ('ci-token', 'd:ci-probe', 2, 'h', 'k', 'live');" > /dev/null 2>&1; then
            echo "::error::itinerary_status_check 约束没有生效"
            exit 1
          fi
          echo "OK: itinerary.status=live 被拒绝"

          # 限额计数器不能为负
          if q "insert into trip_quota (owner_key, day, used) values ('d:ci-probe', '2026-01-01', -1);" > /dev/null 2>&1; then
            echo "::error::quota_used_check 约束没有生效"
            exit 1
          fi
          echo "OK: trip_quota.used=-1 被拒绝"

          # post.status 只有 visible/hidden。没有自动审核, 下架就是把它改成 hidden
          if q "insert into post (user_id, body, status) values ($uid, '测试', 'live');" > /dev/null 2>&1; then
            echo "::error::post_status_check 约束没有生效"
            exit 1
          fi
          echo "OK: post.status=live 被拒绝"

          # 空正文必须被拒: 表里那条 length(body) >= 1 是产品上限之外的最后一道兜底
          if q "insert into post (user_id, body) values ($uid, '');" > /dev/null 2>&1; then
            echo "::error::post_body_not_blank 约束没有生效"
            exit 1
          fi
          echo "OK: post.body 为空被拒绝"

          # 作者删除是硬删: 删完 app_user 还在, 动态没了
          q "insert into post (user_id, body) values ($uid, '待删除');" > /dev/null
          q "delete from post where user_id=$uid and body='待删除';" > /dev/null
          expect 0 "$(q "select count(*) from post where user_id=$uid and body='待删除';")" "动态被硬删干净"
          expect 1 "$(q "select count(*) from app_user where device_id='ci-probe';")" "删动态不动 app_user"

      - name: 断言 v_latest_rec 只取最近一批
        run: |
          set -euo pipefail
          q() { psql -h 127.0.0.1 -U postgres -d attraction_atlas -tAc "$1"; }
          uid=$(q "select id from app_user where device_id='ci-probe';")
          aid=$(q "select id from attraction where slug='west-lake';")

          q "insert into rec_result (user_id, attraction_id, score, rank, algo, reason, batch_id, generated_at)
             values ($uid, $aid, 0.9, 1, 'bpr', '测试', 'batch-old', now() - interval '1 hour');" > /dev/null
          q "insert into rec_result (user_id, attraction_id, score, rank, algo, reason, batch_id, generated_at)
             values ($uid, $aid, 0.8, 1, 'bpr', '测试', 'batch-new', now());" > /dev/null

          n=$(q "select count(*) from v_latest_rec where user_id=$uid;")
          if [ "$n" != "1" ]; then echo "::error::v_latest_rec 期望 1 行, 实际 $n"; exit 1; fi
          batch=$(q "select batch_id from v_latest_rec where user_id=$uid;")
          if [ "$batch" != "batch-new" ]; then echo "::error::v_latest_rec 取到了 $batch, 应为 batch-new"; exit 1; fi
          echo "OK: v_latest_rec 只返回最新一批"
