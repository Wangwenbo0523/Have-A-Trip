name: db-schema

# 用真实 PostgreSQL 验证 db/schema.sql 与 db/seed/seed.sql:
# 各跑两遍证明幂等, 再断言结构、行数与 CHECK 约束。
# 本机没有 psql, 所以这是「行为层」唯一的验证手段。
on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - ".github/workflows/db-schema.yml"
  pull_request:
    paths:
      - "db/**"
      - ".github/workflows/db-schema.yml"
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attraction_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: 应用 schema.sql 两次(验证幂等)
        run: |
          for i in 1 2; do
            echo "--- schema.sql 第 $i 次 ---"
            psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/schema.sql
          done

      - name: 应用 seed.sql 与 images.sql 各两次(验证幂等)
        run: |
          for i in 1 2; do
            echo "--- 第 $i 次 ---"
            psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/seed/seed.sql
            psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/seed/images.sql
          done

      - name: 断言结构与数据
        run: |
          set -euo pipefail
          q() { psql -h 127.0.0.1 -U postgres -d attraction_atlas -tAc "$1"; }
          expect() { # expect <期望> <实际> <说明>
            if [ "$1" != "$2" ]; then echo "::error::$3: 期望 $1, 实际 $2"; exit 1; fi
            echo "OK: $3 = $2"
          }

          expect 9 "$(q "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")" "表数量"
          expect 1 "$(q "select count(*) from information_schema.views where table_schema='public';")" "视图数量"
          expect 1 "$(q "select count(*) from information_schema.triggers where trigger_name='trg_attraction_updated_at';")" "updated_at 触发器"

          # 种子数据规模。改了 db/seed/seed.sql 就要一起改这里的数字, 否则 CI 会拦下来
          expect 7 "$(q "select count(*) from category;")" "category 行数"
          expect 19 "$(q "select count(*) from tag;")" "tag 行数"
          expect 50 "$(q "select count(*) from attraction;")" "attraction 行数(重跑未重复插入)"
          expect 175 "$(q "select count(*) from attraction_tag;")" "attraction_tag 行数"
          expect 1 "$(q "select count(*) from schema_version where version='0001_init';")" "schema_version 记录数"

          # 种子数据的口径, 见 db/README.md「种子数据的口径」
          # 这几条是把「不编造、不夸大」变成机器能拦的检查
          expect 0 "$(q "select count(*) from attraction where source is null or license is null;")" "缺 source/license 的景点数"
          expect 0 "$(q "select count(*) from attraction where status <> 'published';")" "非 published 的种子景点数"
          expect 0 "$(q "select count(*) from attraction where lat is not null or lon is not null;")" "带坐标的种子景点数(一期不做地图与定位)"
          expect 0 "$(q "select count(*) from attraction where rating_avg <> 0 or rating_count <> 0;")" "带评分的种子景点数(评分只能由 behavior_log 聚合)"
          expect 0 "$(q "select count(*) from attraction where ticket_price is not null and ticket_price <> 0;")" "写了票价但不确定免费的景点数"
          expect 50 "$(q "select count(*) from attraction_image;")" "图片行数"
          expect 50 "$(q "select count(distinct attraction_id) from attraction_image;")" "有配图的景点数"
          expect 0 "$(q "select count(*) from attraction_image where credit is null or credit = '' or license is null or license = '';")" "缺 credit/license 的图片数"
          expect 0 "$(q "select count(*) from attraction a where not exists (select 1 from attraction_tag x where x.attraction_id = a.id);")" "没有任何标签的景点数"
          expect 0 "$(q "select count(*) from category c where not exists (select 1 from attraction a where a.category_id = c.id);")" "没有景点的分类数"
          expect 0 "$(q "select count(*) from tag g where not exists (select 1 from attraction_tag x where x.tag_id = g.id);")" "没被用到的标签数"

      - name: 断言重跑种子能修回被改动的行
        run: |
          set -euo pipefail
          q() { psql -h 127.0.0.1 -U postgres -d attraction_atlas -tAc "$1"; }
          expect() { if [ "$1" != "$2" ]; then echo "::error::$3: 期望 $1, 实际 $2"; exit 1; fi; echo "OK: $3"; }

          # 模拟两种情况: 有人手工改了库里的一行, 以及库里躺着的还是上一个版本的种子
          # (旧版种子写死过坐标与票价, 也用过 ON CONFLICT DO NOTHING, 那样的库不会被修好)
          q "update attraction set name='旧名字', lat=1.0, lon=2.0, ticket_price=999.00 where slug='west-lake';" > /dev/null
          q "delete from attraction_tag where attraction_id = (select id from attraction where slug='west-lake');" > /dev/null

          psql -h 127.0.0.1 -U postgres -d attraction_atlas -v ON_ERROR_STOP=1 -q -f db/seed/seed.sql

          expect "西湖" "$(q "select name from attraction where slug='west-lake';")" "name 被同步回文件里的版本"
          expect 1 "$(q "select count(*) from attraction where slug='west-lake' and lat is null and lon is null;")" "坐标被清回 NULL"
          expect 1 "$(q "select count(*) from attraction where slug='west-lake' and ticket_price = 0;")" "票价回到文件里的 0"
          expect 4 "$(q "select count(*) from attraction_tag where attraction_id = (select id from attraction where slug='west-lake');")" "被删掉的标签关联被重建"
          expect 50 "$(q "select count(*) from attraction;")" "重跑后景点数仍是 50, 没有多出来"

      - name: 断言 CHECK 约束真的拦得住
        run: |
          set -euo pipefail
          q() { psql -h 127.0.0.1 -U postgres -d attraction_atlas -tAc "$1"; }

          q "insert into app_user (device_id) values ('ci-probe');" > /dev/null
          uid=$(q "select id from app_user where device_id='ci-probe';")
          aid=$(q "select id from attraction where slug='west-lake';")

          # rate 事件不带 rating 必须被拒
          if q "insert into behavior_log (user_id, attraction_id, event_type) values ($uid, $aid, 'rate');" > /dev/null 2>&1; then
            echo "::error::behavior_rate_needs_rating 约束没有生效"
            exit 1
          fi
          echo "OK: rate 缺 rating 被拒绝"

          # 越界评分必须被拒
          if q "insert into behavior_log (user_id, attraction_id, event_type, rating) values ($uid, $aid, 'rate', 9);" > /dev/null 2>&1; then
            echo "::error::rating 范围约束没有生效"
            exit 1
          fi
          echo "OK: rating=9 被拒绝"

          # 非法 event_type 必须被拒
          if q "insert into behavior_log (user_id, attraction_id, event_type) values ($uid, $aid, 'click');" > /dev/null 2>&1; then
            echo "::error::event_type 枚举约束没有生效"
            exit 1
          fi
          echo "OK: event_type=click 被拒绝"

          # 合法的插入必须成功
          q "insert into behavior_log (user_id, attraction_id, event_type, rating) values ($uid, $aid, 'rate', 4.5);" > /dev/null
          expect() { if [ "$1" != "$2" ]; then echo "::error::$3"; exit 1; fi; echo "OK: $3"; }
          expect 1 "$(q "select count(*) from behavior_log where user_id=$uid and event_type='rate';")" "合法 rate 事件写入成功"

          # status 只允许三态
          if q "insert into attraction (slug, name, category_id, status, source, license) values ('x','x',(select id from category limit 1),'live','t','t');" > /dev/null 2>&1; then
            echo "::error::status 枚举约束没有生效"
            exit 1
          fi
          echo "OK: status=live 被拒绝"

      - name: 断言 v_latest_rec 只取最近一批
        run: |
          set -euo pipefail
          q() { psql -h 127.0.0.1 -U postgres -d attraction_atlas -tAc "$1"; }
          uid=$(q "select id from app_user where device_id='ci-probe';")
          aid=$(q "select id from attraction where slug='west-lake';")

          q "insert into rec_result (user_id, attraction_id, score, rank, algo, reason, batch_id, generated_at)
             values ($uid, $aid, 0.9, 1, 'bpr', '测试', 'batch-old', now() - interval '1 hour');" > /dev/null
          q "insert into rec_result (user_id, attraction_id, score, rank, algo, reason, batch_id, generated_at)
             values ($uid, $aid, 0.8, 1, 'bpr', '测试', 'batch-new', now());" > /dev/null

          n=$(q "select count(*) from v_latest_rec where user_id=$uid;")
          if [ "$n" != "1" ]; then echo "::error::v_latest_rec 期望 1 行, 实际 $n"; exit 1; fi
          batch=$(q "select batch_id from v_latest_rec where user_id=$uid;")
          if [ "$batch" != "batch-new" ]; then echo "::error::v_latest_rec 取到了 $batch, 应为 batch-new"; exit 1; fi
          echo "OK: v_latest_rec 只返回最新一批"