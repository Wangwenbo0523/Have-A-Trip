name: backend-test

# 后端测试。带一个真实 PostgreSQL service, 是为了让 tests/test_schema_parity.py
# 真的跑起来 —— db/schema.sql 与 ORM 模型是双份 DDL, 不对拍就会在运行期炸。
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "db/schema.sql"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - "db/schema.sql"
      - ".github/workflows/backend-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attraction_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt

      - name: 跑测试(含 db/schema.sql 对拍)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/attraction_atlas
        run: python -m pytest -v

      - name: 确认对拍测试没有偷偷跳过
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/attraction_atlas
        run: |
          out=$(python -m pytest tests/test_schema_parity.py -q 2>&1)
          echo "$out"
          if echo "$out" | grep -q "skipped"; then
            echo "::error::schema 对拍测试被跳过了 —— TEST_DATABASE_URL 没生效?"
            exit 1
          fi
